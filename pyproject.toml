[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainplug"
version = "0.3.0"
description = "A second brain for you and your AI assistants: a 3D map of everything you write and a memory they plug into. 100% local."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Juan Rodríguez" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "pypdf>=4"]

[project.optional-dependencies]
agent = ["mcp>=1.2"]
dev = ["pytest", "mcp>=1.2"]

[project.scripts]
brainplug = "brainplug.__main__:main"

[tool.setuptools]
packages = ["brainplug"]

[tool.setuptools.package-data]
brainplug = ["templates/*.html", "vendor/*"]
