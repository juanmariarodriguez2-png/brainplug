[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brainplug"
version = "0.4.0"
description = "A second brain for you and your AI assistants: a 3D map of everything you write and a memory they plug into. 100% local."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juan Rodríguez" }]
requires-python = ">=3.10"
keywords = ["second brain", "memory", "mcp", "model context protocol", "obsidian", "chatgpt", "claude",
            "codex", "personal knowledge", "visualization", "local-first"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Text Processing :: Indexing",
]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "pypdf>=4", "mcp>=1.2", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
agent = []  # the MCP SDK is a regular dependency now; kept so "brainplug[agent]" still installs
dev = ["pytest"]

[project.urls]
Homepage = "https://brainplug.app/"
Source = "https://github.com/juanmariarodriguez2-png/brainplug"
Issues = "https://github.com/juanmariarodriguez2-png/brainplug/issues"
Changelog = "https://github.com/juanmariarodriguez2-png/brainplug/blob/main/CHANGELOG.md"

[project.scripts]
brainplug = "brainplug.__main__:main"

[tool.setuptools]
# the viewer template and its vendored files ship as data packages
packages = ["brainplug", "brainplug.templates", "brainplug.vendor"]

[tool.setuptools.package-data]
"brainplug.templates" = ["*.html"]
"brainplug.vendor" = ["*"]
