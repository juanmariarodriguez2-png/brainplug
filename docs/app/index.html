<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make your Brainplug</title>
<meta name="description" content="Drop your AI chats, notes, mail and messages and get a 3D map of what you write about. Everything runs in this tab: nothing is uploaded.">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop stop-color='%236f8cff'/%3E%3Cstop offset='.5' stop-color='%23ff6ad5'/%3E%3Cstop offset='1' stop-color='%23ffb62e'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../site.css">
<style>
  main { padding-bottom: 20px; }
  .intro { padding-top: clamp(28px, 6vw, 72px); }
  #drop { margin-top: 38px; border: 1px solid #3a3a42; border-radius: 20px; padding: clamp(28px, 5vw, 56px) 24px; text-align: center; }
  #drop.over { border-color: transparent; background: linear-gradient(#000, #000) padding-box, var(--spectrum) border-box; }
  #drop h2 { font-size: clamp(20px, 2.4vw, 26px); font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; }
  #drop p { color: var(--mute); margin: 0 auto; max-width: 620px; font-size: 15.5px; }
  #drop .actions { justify-content: center; margin-top: 22px; }
  #list { margin-top: 26px; }
  #list li { grid-template-columns: 1fr auto auto; align-items: center; padding: 12px 0; font-size: 15.5px; }
  #list .size { color: var(--mute); font-variant-numeric: tabular-nums; font-size: 14px; }
  #list button, .link { all: unset; cursor: pointer; color: var(--mute); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #3a3a42; }
  #list button:hover, .link:hover { color: var(--ink); }
  #list .name { overflow-wrap: anywhere; }
  #ext { display: none; margin-top: 18px; padding: 14px 18px; border-radius: 14px; background: linear-gradient(#000, #000) padding-box, var(--spectrum) border-box; border: 1px solid transparent;
    align-items: center; gap: 14px; flex-wrap: wrap; font-size: 15.5px; }
  #ext.on { display: flex; }
  #ext .btn { padding: 9px 16px; font-size: 14.5px; margin-left: auto; }
  details.opts { margin-top: 26px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  details.opts summary { cursor: pointer; padding: 16px 0; font-weight: 500; list-style: none; display: flex; justify-content: space-between; }
  details.opts summary::-webkit-details-marker { display: none; }
  details.opts summary::after { content: "+"; color: var(--mute); font-size: 20px; line-height: 1; }
  details.opts[open] summary::after { content: "–"; }
  .fields { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 28px; padding: 4px 0 24px; }
  .fields label { display: block; font-size: 14.5px; color: var(--soft); }
  .fields label.full { grid-column: 1 / -1; }
  .fields small { display: block; color: var(--mute); font-size: 13.5px; margin-top: 6px; }
  .fields input[type=text], .fields select { display: block; width: 100%; margin-top: 7px; background: #000; color: var(--ink); border: 1px solid #3a3a42;
    border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 15.5px; }
  .fields .check { display: flex; gap: 10px; align-items: flex-start; color: var(--soft); }
  .fields .check input { margin-top: 4px; accent-color: #a77bff; width: 16px; height: 16px; flex: none; }
  #go { margin-top: 30px; align-items: center; }
  #status { margin-top: 18px; min-height: 26px; color: var(--soft); font-size: 15.5px; overflow-wrap: anywhere; }
  #status.bad { color: #ff8a9a; }
  #status ul { margin: 8px 0 0; padding-left: 18px; color: var(--mute); font-size: 14.5px; }
  .bar { height: 2px; background: var(--line); margin-top: 12px; overflow: hidden; border-radius: 2px; display: none; }
  .bar.on { display: block; }
  .bar i { display: block; height: 100%; width: 0; background: var(--spectrum); transition: width 0.25s; }
  #result { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 20; }
  #result.on { display: flex; }
  #result .bar2 { display: flex; align-items: center; gap: 18px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 14.5px; flex-wrap: wrap; }
  #result .bar2 span { color: var(--mute); margin-right: auto; }
  #result .bar2 .btn { padding: 8px 15px; font-size: 14px; }
  #result iframe { flex: 1; width: 100%; border: 0; background: #000; }
  @media (max-width: 720px) { .fields { grid-template-columns: 1fr; } #list li { grid-template-columns: 1fr auto; } #list .size { display: none; } #result .bar2 span { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="mark" href="../">Brainplug</a>
    <a href="../#how" data-i="navHow"></a>
    <a href="https://github.com/juanmariarodriguez2-png/brainplug">GitHub</a>
    <button class="lang" id="lang" type="button"></button>
  </header>

  <main>
    <div class="intro">
      <h1 class="say" data-i="say"></h1>
      <p class="lead" data-i="lead"></p>
      <p class="note" id="offline" style="margin-top:10px;min-height:22px"></p>
    </div>

    <div id="drop">
      <h2 data-i="dropT"></h2>
      <p data-i="dropP"></p>
      <div class="actions">
        <button class="btn ghost" id="pickFiles" type="button" data-i="pickFiles"></button>
        <button class="btn ghost" id="pickFolder" type="button" data-i="pickFolder"></button>
      </div>
      <input id="inFiles" type="file" multiple hidden>
      <input id="inFolder" type="file" webkitdirectory hidden>
    </div>

    <div id="ext"><span id="extText"></span><button class="btn" id="extAdd" type="button" data-i="extAdd"></button></div>
    <ul class="rows" id="list" hidden></ul>

    <details class="opts">
      <summary data-i="optsT"></summary>
      <div class="fields">
        <label><span data-i="oTitle"></span><input id="oTitle" type="text" maxlength="60"></label>
        <label><span data-i="oLang"></span><select id="oLang"><option value="en">English</option><option value="es">Español</option></select></label>
        <label class="full"><span data-i="oMe"></span><input id="oMe" type="text" autocomplete="off" spellcheck="false"><small data-i="oMeHint"></small></label>
        <label><span data-i="oTopics"></span><select id="oTopics"></select></label>
        <span></span>
        <label class="check full"><input id="oPrivate" type="checkbox"><span data-i="oPrivate"></span></label>
        <label class="check full"><input id="oPdf" type="checkbox"><span data-i="oPdf"></span></label>
      </div>
    </details>

    <div class="actions" id="go">
      <button class="btn" id="build" type="button" data-i="build" disabled></button>
      <button class="link" id="example" type="button" data-i="example"></button>
    </div>
    <div class="bar" id="bar"><i></i></div>
    <div id="status" role="status" aria-live="polite"></div>

    <section id="export">
      <h2 class="say small" data-i="expSay"></h2>
      <ul class="rows" style="margin-top:28px">
        <li><span class="name">ChatGPT</span><span class="what" data-i="eChatgpt"></span></li>
        <li><span class="name">Claude</span><span class="what" data-i="eClaude"></span></li>
        <li><span class="name">Gemini</span><span class="what" data-i="eGemini"></span></li>
        <li><span class="name">Obsidian</span><span class="what" data-i="eObsidian"></span></li>
        <li><span class="name">Notion</span><span class="what" data-i="eNotion"></span></li>
        <li><span class="name">Gmail</span><span class="what" data-i="eGmail"></span></li>
        <li><span class="name">WhatsApp</span><span class="what" data-i="eWhatsapp"></span></li>
        <li><span class="name" data-i="eDocsT"></span><span class="what" data-i="eDocs"></span></li>
        <li><span class="name" data-i="eLiveT"></span><span class="what" data-i="eLive"></span></li>
      </ul>
    </section>
  </main>

  <footer class="end">
    <span data-i="foot"></span>
    <a href="https://github.com/juanmariarodriguez2-png/brainplug" data-i="footCode"></a>
  </footer>
</div>

<div id="result">
  <div class="bar2">
    <button class="link" id="back" type="button" data-i="back"></button>
    <span id="resNote"></span>
    <a class="btn" id="download" download="brainplug.html" data-i="download"></a>
  </div>
  <iframe id="frame" title="Brainplug"></iframe>
</div>

<script type="module">
const TXT = {
  en: {
    lang: '<b>EN</b> / ES', navHow: 'How it works',
    say: 'Drop in what you have written and see the shape of it.',
    lead: 'Everything is worked out in this tab. Nothing you add is uploaded anywhere.',
    offline: 'The page has finished loading. To check for yourself, switch off your wifi before you add your files.',
    dropT: 'Drop files or folders here',
    dropP: 'Use them exactly as each app gives them to you: the .zip from ChatGPT, Claude, Notion or Google Takeout, your Obsidian folder, a Gmail .mbox, WhatsApp chats, Word and PDF files.',
    pickFiles: 'Choose files', pickFolder: 'Choose a folder',
    extText: n => `The Brainplug extension has ${n} messages saved in this browser.`, extAdd: 'Add them', extName: 'Live capture (extension)',
    optsT: 'Options', oTitle: 'Title', oLang: 'Language of the result', oMe: 'Who you are',
    oMeHint: 'Your email (for Gmail) and your name as it appears in WhatsApp, separated by commas. Leave it empty and Brainplug works it out when it can.',
    oTopics: 'Topics', auto: 'Automatic',
    oPrivate: 'Private mode: leave titles and text out, so the result is safe to share.',
    oPdf: 'Also read the PDFs inside folders. They are skipped by default because they are usually other people’s writing.',
    build: 'Make my Brainplug', example: 'See an example first',
    files: n => `${n} files`, remove: 'Remove',
    stage: { file: 'Reading', words: 'Counting words', directions: 'Working out what you write about', topics: 'Grouping into topics', connections: 'Looking for connections', layout: 'Drawing the brain', render: 'Putting the page together' },
    errNeed: 'There is not enough to draw yet: at least 3 chats, notes, documents or message days are needed. Add more files.',
    errJson: 'That JSON file is not an export Brainplug knows. Use conversations.json (ChatGPT or Claude), MyActivity.json (Gemini) or the extension’s capture file.',
    errAny: m => `That did not work: ${m}`,
    noteWa: who => `WhatsApp chats were skipped because it is not clear which sender is you. Type your name under Options › Who you are (seen in the chats: ${who}).`,
    notePdf: name => `The PDF ${name} could not be read.`,
    back: 'Back', download: 'Download the HTML', resNote: 'The file works offline. It contains your text unless you used private mode.',
    resDemo: 'This is an example with invented data.',
    expSay: 'Where to find your files in each app.',
    eChatgpt: 'Settings › Data controls › Export data. A .zip arrives by email; drop it as it is.',
    eClaude: 'Settings › Privacy › Export data. A .zip arrives by email; drop it as it is.',
    eGemini: 'takeout.google.com › My Activity only › Gemini Apps, and choose JSON as the format. <small>Google lists single prompts, so chats are rebuilt from the time between them.</small>',
    eObsidian: 'Nothing to export: choose your vault folder.',
    eNotion: 'Settings › Export all workspace content › Markdown & CSV. <small>The export has no creation dates unless a page has a date property; the Python version can read them through the Notion API.</small>',
    eGmail: 'takeout.google.com › Mail only › the “Sent” label. Unzip it and drop the .mbox. <small>Only what you typed is kept: no quoted replies, no signatures.</small>',
    eWhatsapp: 'Open a chat › More › Export chat › Without media. Drop the .txt or the .zip. <small>Only your own messages are kept.</small>',
    eDocsT: 'Word and PDF', eDocs: 'Drop .docx and .pdf files. <small>These are read whole, so add the ones you wrote.</small>',
    eLiveT: 'Live capture', eLive: 'The browser extension saves what you type into ChatGPT, Claude and Gemini as you go. <small>It appears here on its own when the extension is installed.</small>',
    foot: 'Brainplug is open source (MIT). No account, no server, no tracking.', footCode: 'Read the code',
  },
  es: {
    lang: 'EN / <b>ES</b>', navHow: 'Cómo funciona',
    say: 'Suelta aquí lo que has escrito y mira qué forma tiene.',
    lead: 'Todo se calcula en esta pestaña. Nada de lo que añadas se sube a ningún sitio.',
    offline: 'La página ha terminado de cargar. Si quieres comprobarlo, desconecta el wifi antes de añadir tus archivos.',
    dropT: 'Suelta aquí archivos o carpetas',
    dropP: 'Sirven tal cual te los da cada app: el .zip de ChatGPT, Claude, Notion o Google Takeout, tu carpeta de Obsidian, un .mbox de Gmail, chats de WhatsApp, archivos Word y PDF.',
    pickFiles: 'Elegir archivos', pickFolder: 'Elegir una carpeta',
    extText: n => `La extensión de Brainplug tiene ${n} mensajes guardados en este navegador.`, extAdd: 'Añadirlos', extName: 'Captura en vivo (extensión)',
    optsT: 'Opciones', oTitle: 'Título', oLang: 'Idioma del resultado', oMe: 'Quién eres',
    oMeHint: 'Tu correo (para Gmail) y tu nombre tal como sale en WhatsApp, separados por comas. Si lo dejas vacío, Brainplug lo deduce cuando puede.',
    oTopics: 'Temas', auto: 'Automático',
    oPrivate: 'Modo privado: deja fuera los títulos y el texto, para poder compartir el resultado.',
    oPdf: 'Leer también los PDF que haya dentro de las carpetas. Por defecto se saltan, porque suelen ser textos de otras personas.',
    build: 'Crear mi Brainplug', example: 'Ver antes un ejemplo',
    files: n => `${n} archivos`, remove: 'Quitar',
    stage: { file: 'Leyendo', words: 'Contando palabras', directions: 'Viendo de qué escribes', topics: 'Agrupando por temas', connections: 'Buscando conexiones', layout: 'Dibujando el cerebro', render: 'Montando la página' },
    errNeed: 'Todavía no hay suficiente para dibujar: hacen falta al menos 3 chats, notas, documentos o días de mensajes. Añade más archivos.',
    errJson: 'Ese JSON no es una exportación que Brainplug conozca. Usa conversations.json (ChatGPT o Claude), MyActivity.json (Gemini) o el archivo de captura de la extensión.',
    errAny: m => `No ha funcionado: ${m}`,
    noteWa: who => `Los chats de WhatsApp se han saltado porque no está claro qué remitente eres tú. Escribe tu nombre en Opciones › Quién eres (en los chats aparecen: ${who}).`,
    notePdf: name => `No se ha podido leer el PDF ${name}.`,
    back: 'Volver', download: 'Descargar el HTML', resNote: 'El archivo funciona sin conexión. Contiene tu texto, salvo que uses el modo privado.',
    resDemo: 'Esto es un ejemplo con datos inventados.',
    expSay: 'Dónde están tus archivos en cada app.',
    eChatgpt: 'Ajustes › Controles de datos › Exportar datos. Te llega un .zip por correo; suéltalo tal cual.',
    eClaude: 'Ajustes › Privacidad › Exportar datos. Te llega un .zip por correo; suéltalo tal cual.',
    eGemini: 'takeout.google.com › solo Mi actividad › Aplicaciones de Gemini, y elige JSON como formato. <small>Google guarda cada pregunta suelta, así que los chats se reconstruyen por el tiempo entre ellas.</small>',
    eObsidian: 'No hay que exportar nada: elige la carpeta de tu bóveda.',
    eNotion: 'Ajustes › Exportar todo el contenido › Markdown y CSV. <small>La exportación no trae la fecha de creación salvo que la página tenga una propiedad de fecha; la versión en Python puede leerla con la API de Notion.</small>',
    eGmail: 'takeout.google.com › solo Correo › etiqueta «Enviados». Descomprime y suelta el .mbox. <small>Solo se guarda lo que tú tecleaste: sin respuestas citadas ni firmas.</small>',
    eWhatsapp: 'Abre un chat › Más › Exportar chat › Sin archivos. Suelta el .txt o el .zip. <small>Solo se guardan tus propios mensajes.</small>',
    eDocsT: 'Word y PDF', eDocs: 'Suelta archivos .docx y .pdf. <small>Estos se leen enteros, así que añade los que hayas escrito tú.</small>',
    eLiveT: 'Captura en vivo', eLive: 'La extensión del navegador guarda lo que escribes en ChatGPT, Claude y Gemini mientras lo usas. <small>Aparece aquí sola cuando la extensión está instalada.</small>',
    foot: 'Brainplug es código abierto (MIT). Sin cuenta, sin servidor, sin rastreo.', footCode: 'Leer el código',
  },
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let lang = new URLSearchParams(location.search).get('lang') || (navigator.language || 'en').slice(0, 2);
lang = lang === 'es' ? 'es' : 'en';
let T = TXT[lang];

const groups = [];        // what the person added: { name, size, count, inputs: [{ path, blob, mtime, inside }] }
let capture = null;       // messages offered by the browser extension
let resultUrl = null, busy = false, offlineReady = false;

function applyLang() {
  T = TXT[lang];
  document.documentElement.lang = lang;
  document.title = lang === 'es' ? 'Crea tu Brainplug' : 'Make your Brainplug';
  document.querySelectorAll('[data-i]').forEach(el => { el.innerHTML = el.classList.contains('say') ? `<span>${T[el.dataset.i]}</span>` : T[el.dataset.i]; });
  $('lang').innerHTML = T.lang;
  $('oTopics').innerHTML = `<option value="">${T.auto}</option>` + Array.from({ length: 13 }, (_, i) => `<option>${i + 4}</option>`).join('');
  if (!$('oTitle').dataset.touched) $('oTitle').value = lang === 'es' ? 'Mi Brainplug' : 'My Brainplug';
  if (!$('oLang').dataset.touched) $('oLang').value = lang;
  drawList(); drawExt();
  if (offlineReady) $('offline').textContent = T.offline;
}
$('lang').onclick = () => { lang = lang === 'en' ? 'es' : 'en'; applyLang(); };
$('oTitle').oninput = () => { $('oTitle').dataset.touched = '1'; };
$('oLang').onchange = () => { $('oLang').dataset.touched = '1'; };

// ---------------------------------------------------------------- inputs
const WANTED = /\.(md|markdown|txt|json|html|mbox|zip|docx|pdf)$/i;
const size = n => (n < 1e6 ? `${Math.max(1, Math.round(n / 1e3))} KB` : n < 1e9 ? `${(n / 1e6).toFixed(1)} MB` : `${(n / 1e9).toFixed(2)} GB`);

function addGroup(name, inputs) {
  if (!inputs.length) return;
  groups.push({ name, inputs, count: inputs.length, size: inputs.reduce((n, i) => n + i.blob.size, 0), folder: inputs[0].inside });
  drawList();
}
function addLoose(files) {
  for (const file of files) addGroup(file.name, [{ path: file.name, blob: file, mtime: file.lastModified, inside: false }]);
}
function keep(path) {
  const parts = path.split('/');
  if (parts.includes('node_modules')) return false;
  const hidden = parts.findIndex(p => p.startsWith('.'));
  if (hidden >= 0) return parts[hidden] === '.obsidian';  // only needed to recognise a vault
  return WANTED.test(path);
}
function addFolder(files) {  // from <input webkitdirectory>: every file carries its path
  const byTop = new Map();
  let vaultSeen = new Set();
  for (const file of files) {
    const path = file.webkitRelativePath || file.name;
    if (!keep(path)) continue;
    const top = path.split('/')[0];
    if (path.includes('/.obsidian/')) { if (vaultSeen.has(top)) continue; vaultSeen.add(top); }
    if (!byTop.has(top)) byTop.set(top, []);
    byTop.get(top).push({ path, blob: file, mtime: file.lastModified, inside: true });
  }
  for (const [top, inputs] of byTop) addGroup(top + '/', inputs);
}
async function walk(entry, out, state) {  // from drag and drop
  if (entry.isFile) {
    const path = entry.fullPath.replace(/^\//, '');
    if (!keep(path)) return;
    if (path.includes('/.obsidian/')) { if (state.vault) return; state.vault = true; }
    const file = await new Promise((ok, no) => entry.file(ok, no));
    out.push({ path, blob: file, mtime: file.lastModified, inside: true });
  } else if (entry.isDirectory) {
    if (entry.name === 'node_modules' || (entry.name.startsWith('.') && entry.name !== '.obsidian')) return;
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((ok, no) => reader.readEntries(ok, no));
      if (!batch.length) break;
      for (const child of batch) await walk(child, out, state);
    }
  }
}
const drop = $('drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());
drop.addEventListener('drop', async e => {
  const entries = [...(e.dataTransfer.items || [])].map(i => (i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)).filter(Boolean);
  if (!entries.length) return addLoose(e.dataTransfer.files);
  for (const entry of entries) {
    if (entry.isFile) addLoose([await new Promise((ok, no) => entry.file(ok, no))]);
    else { const out = []; await walk(entry, out, {}); addGroup(entry.name + '/', out); }
  }
});
$('pickFiles').onclick = () => $('inFiles').click();
$('pickFolder').onclick = () => $('inFolder').click();
$('inFiles').onchange = e => { addLoose(e.target.files); e.target.value = ''; };
$('inFolder').onchange = e => { addFolder(e.target.files); e.target.value = ''; };

function drawList() {
  const list = $('list');
  list.hidden = !groups.length;
  list.innerHTML = groups.map((g, i) => `<li><span class="name">${esc(g.name)}${g.folder ? ` <span class="note">${T.files(g.count)}</span>` : ''}</span>
    <span class="size">${size(g.size)}</span><button type="button" data-x="${i}">${T.remove}</button></li>`).join('');
  list.querySelectorAll('button').forEach(b => { b.onclick = () => { groups.splice(+b.dataset.x, 1); drawList(); }; });
  $('build').disabled = !groups.length || busy;
}

// ----------------------------------- the browser extension offers its captures
function drawExt() {
  $('ext').classList.toggle('on', !!(capture && capture.count && !capture.added));
  if (capture) $('extText').textContent = T.extText(capture.count.toLocaleString(lang));
}
window.addEventListener('message', e => {
  const msg = e.data;
  if (e.source !== window || !msg || msg.source !== 'brainplug-ext') return;
  if (msg.type === 'count') { capture = { count: msg.count }; drawExt(); }
  if (msg.type === 'items' && capture && !capture.added) {
    capture.added = true;
    const blob = new Blob([JSON.stringify({ format: 'brainplug-capture', version: 1, items: msg.items })], { type: 'application/json' });
    addGroup(T.extName, [{ path: 'brainplug-capture.json', blob, mtime: Date.now(), inside: false }]);
    drawExt();
  }
});
$('extAdd').onclick = () => window.postMessage({ source: 'brainplug-app', type: 'get' }, location.origin);
window.postMessage({ source: 'brainplug-app', type: 'hello' }, location.origin);
setTimeout(() => window.postMessage({ source: 'brainplug-app', type: 'hello' }, location.origin), 600);

// ------------------------------------- everything is fetched when the page opens,
// so building needs no connection afterwards (switch the wifi off and try)
const engine = import('./engine/index.js');
const templateText = fetch(new URL('./viewer.tpl.html', import.meta.url)).then(r => { if (!r.ok) throw new Error('viewer.tpl.html'); return r.text(); });
let worker = null, pong = null, pdfReady = null;
function getWorker() {
  if (worker) return worker;
  worker = new Worker(new URL('./worker.js', import.meta.url), { type: 'module' });
  worker.onmessage = onWorkerMessage;
  worker.onerror = e => { worker = null; fail(e.message || 'worker error'); };
  return worker;
}
function loadPdf() {
  if (!pdfReady) {
    pdfReady = (async () => {
      const lib = await import('./vendor/pdf.min.mjs');
      const code = await (await fetch(new URL('./vendor/pdf.worker.min.mjs', import.meta.url))).blob();
      lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
      return lib;
    })();
    pdfReady.catch(() => { pdfReady = null; });
  }
  return pdfReady;
}
async function pdfText(bytes) {
  const pdfjs = await loadPdf();
  const task = pdfjs.getDocument({ data: bytes });
  try {
    const doc = await task.promise, pages = [];
    for (let p = 1; p <= Math.min(doc.numPages, 300); p++) {
      const content = await (await doc.getPage(p)).getTextContent();
      pages.push(content.items.map(i => i.str || '').join(' '));
    }
    const info = ((await doc.getMetadata().catch(() => null)) || {}).info || {};
    const m = /D:(\d{4})(\d{2})(\d{2})(\d{2})?(\d{2})?/.exec(info.CreationDate || '');
    return { text: pages.join(' '), title: info.Title || '', created: m ? Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null };
  } finally { try { await task.destroy(); } catch { /* already gone */ } }
}
const workerUp = new Promise(resolve => { pong = resolve; });
getWorker().postMessage({ type: 'ping' });
window.__ready = Promise.all([engine, templateText, workerUp, loadPdf()]).then(() => {
  offlineReady = true; $('offline').textContent = T.offline;
}).catch(() => { /* still works online: pieces load again when they are needed */ });

// ---------------------------------------------------------------- build
const STEPS = ['file', 'words', 'directions', 'topics', 'connections', 'layout', 'render'];
function status(html, bad = false) { $('status').innerHTML = html; $('status').classList.toggle('bad', bad); }
function progress(stage, detail = '') {
  $('bar').classList.add('on');
  $('bar').firstElementChild.style.width = `${Math.round(100 * (STEPS.indexOf(stage) + 1) / (STEPS.length + 1))}%`;
  status(esc(T.stage[stage] + (detail ? ` ${detail.split('/').pop()}` : '')) + '…');
}
function explain(message) {
  if (/at least 3 items/.test(message)) return T.errNeed;
  if (/Unknown JSON|not valid JSON/.test(message)) return T.errJson;
  return T.errAny(esc(message));
}
function showNotes(notes) {
  const lines = notes.map(n => {
    const wa = /^WhatsApp:.*\(seen: (.*)\)\.$/.exec(n);
    const pdf = /^PDF: could not read (.*) \(/.exec(n);
    return wa ? T.noteWa(esc(wa[1])) : pdf ? T.notePdf(esc(pdf[1])) : esc(n);
  });
  status(lines.length ? `<ul>${lines.map(l => `<li>${l}</li>`).join('')}</ul>` : '');
}
function show(url, note, mine = true) {
  $('frame').src = url;
  $('resNote').textContent = note;
  $('download').style.display = mine ? '' : 'none';
  if (mine) $('download').href = url;
  $('result').classList.add('on');
  document.body.style.overflow = 'hidden';
}
$('back').onclick = () => { $('result').classList.remove('on'); $('frame').src = 'about:blank'; document.body.style.overflow = ''; };
$('example').onclick = () => show(lang === 'es' ? '../demo_es.html' : '../demo.html', T.resDemo, false);

function finish() { busy = false; $('bar').classList.remove('on'); drawList(); }
function fail(message) { finish(); status(explain(message), true); }
async function onWorkerMessage(e) {
  const msg = e.data;
  if (msg.type === 'pong') pong();
  else if (msg.type === 'progress') progress(msg.stage, msg.detail);
  else if (msg.type === 'pdf') {
    try { worker.postMessage({ type: 'pdf-result', id: msg.id, result: await pdfText(msg.bytes) }); }
    catch (err) { worker.postMessage({ type: 'pdf-result', id: msg.id, error: String((err && err.message) || err) }); }
  } else if (msg.type === 'error') fail(msg.message);
  else if (msg.type === 'done') {
    try {
      progress('render');
      const html = (await engine).renderHtml(await templateText, msg.payload, $('oLang').value);
      if (resultUrl) URL.revokeObjectURL(resultUrl);
      resultUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      finish(); showNotes(msg.notes);
      show(resultUrl, T.resNote);
      window.__brainplug = { payload: msg.payload, notes: msg.notes };  // handy for checks and for the curious
    } catch (err) { fail(String((err && err.message) || err)); }
  }
}
$('build').onclick = () => {
  if (busy || !groups.length) return;
  busy = true; $('build').disabled = true;
  progress('file');
  getWorker().postMessage({ type: 'build', inputs: groups.flatMap(g => g.inputs), options: {
    title: $('oTitle').value.trim() || 'My Brainplug', topics: +$('oTopics').value || null, private: $('oPrivate').checked,
    pdf: $('oPdf').checked, me: $('oMe').value.split(',').map(s => s.trim()).filter(Boolean),
  } });
};

applyLang();
</script>
</body>
</html>
