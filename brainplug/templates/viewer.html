<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>__TITLE__ · Brainplug</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap;
    src: url(data:font/woff2;base64,__FONT__) format("woff2"); }
  :root {
    --bg: #000; --panel: rgba(0, 0, 0, 0.74); --line: rgba(255, 255, 255, 0.13);
    --text: #f4f4f6; --muted: #8d8d96; --accent: #a77bff;
    --spectrum: linear-gradient(90deg, #6f8cff 0%, #a77bff 22%, #ff6ad5 45%, #ff5d7a 62%, #ff8a3c 82%, #ffb62e 100%);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .spectrum { background: var(--spectrum); -webkit-background-clip: text; background-clip: text; color: transparent; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--text); overflow: hidden; background: #000; }
  button, input, select { font: inherit; color: inherit; }
  header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 14px;
    padding: 14px 20px; z-index: 6; pointer-events: none; }
  header > * { pointer-events: auto; }
  .brand { min-width: 0; margin-right: auto; }
  .brand h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.015em; width: fit-content; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .badge { margin-left: 8px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; letter-spacing: 0; color: #000; background: #f4f4f6;
    -webkit-text-fill-color: #000; vertical-align: middle; }
  nav, .pill { display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 99px; padding: 4px; backdrop-filter: blur(10px); }
  nav button, .pill button { all: unset; cursor: pointer; padding: 6px 13px; border-radius: 99px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  nav button.on, .pill button.on { background: #f4f4f6; color: #000; }
  .tools { display: flex; gap: 8px; margin-left: auto; }
  .tools input, .tools select, .ctl select { background: var(--panel); border: 1px solid var(--line); border-radius: 99px;
    padding: 7px 13px; font-size: 13px; outline: none; backdrop-filter: blur(10px); }
  .tools input { width: 170px; }
  .tools input:focus { border-color: var(--accent); }
  select option { background: #000; }

  .view { position: fixed; inset: 0; display: none; }
  .view.on { display: block; }
  #scene { position: fixed; inset: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); }
  h3 { margin: 0 0 8px; font-size: 12px; font-weight: 500; color: var(--muted); }

  #side { position: fixed; left: 16px; top: 78px; width: 240px; max-height: calc(100% - 160px); overflow: auto; padding: 12px; z-index: 4; }
  .topic { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .topic:hover, .row:hover, .rel:hover { background: rgba(255, 255, 255, 0.06); }
  .topic.dim, .chip.off { opacity: 0.35; }
  .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; flex: none; }
  .topic .bar { grid-column: 2 / 4; height: 3px; border-radius: 3px; opacity: 0.7; }
  .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 99px; font-size: 12px;
    border: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap; }
  .chip.static { cursor: default; }
  .shape { width: 9px; height: 9px; background: currentColor; flex: none; }
  .shape.chat { border-radius: 50%; } .shape.note { transform: rotate(45deg) scale(0.82); }
  .shape.message { border-radius: 50%; background: none; border: 2px solid currentColor; }

  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
    padding: 6px 10px; z-index: 4; border-radius: 99px; max-width: calc(100% - 20px); }
  #bar .pill { border: 0; background: none; padding: 0; backdrop-filter: none; }
  #bar .sep { width: 1px; height: 20px; background: var(--line); }
  #play { all: unset; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; background: rgba(255, 255, 255, 0.11); text-align: center; line-height: 28px; font-size: 12px; }
  #cut { width: 180px; accent-color: var(--accent); }
  #cutLabel { font-size: 12px; color: var(--muted); min-width: 120px; font-variant-numeric: tabular-nums; }
  #hint { position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%); color: var(--muted); font-size: 11px; z-index: 3; text-align: center; white-space: nowrap; }

  #detail { position: fixed; right: 16px; top: 78px; width: 310px; max-height: calc(100% - 160px); overflow: auto; padding: 14px; z-index: 5; display: none; }
  #detail.on { display: block; }
  #detail h2 { margin: 8px 0 8px; font-size: 16px; line-height: 1.3; }
  #detail .close { all: unset; cursor: pointer; float: right; color: var(--muted); font-size: 18px; line-height: 1; padding: 2px 6px; }
  #detail .meta, .muted { color: var(--muted); font-size: 12px; }
  #detail blockquote { margin: 10px 0; padding: 8px 10px; border-left: 2px solid var(--line); color: #c9c9d1; font-size: 12.5px; line-height: 1.45; }
  .rel { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 6px; border-radius: 8px; cursor: pointer; font-size: 12.5px; }
  .rel small { color: var(--muted); }
  #tip { position: fixed; pointer-events: none; z-index: 7; background: rgba(0, 0, 0, 0.94); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; font-size: 12px; max-width: 260px; display: none; }
  #tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  .label3d { position: fixed; z-index: 3; font-size: 12px; font-weight: 600; pointer-events: none; transform: translate(-50%, -50%);
    text-shadow: 0 0 6px #000, 0 0 12px #000; white-space: nowrap; }
  #sideToggle { display: none; }

  .page { position: fixed; inset: 72px 0 0 0; overflow: auto; padding: 8px 28px 48px; }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .page h2 { font-size: 30px; line-height: 1.15; margin: 10px 0 6px; font-weight: 600; letter-spacing: -0.02em; width: fit-content; max-width: 100%;
    background: var(--spectrum); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .page .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .ctl { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 0 0 14px; font-size: 12px; color: var(--muted); }
  .ctl label { display: flex; align-items: center; gap: 8px; }
  .ctl input[type=range] { accent-color: var(--accent); }
  #wavesSvg { width: 100%; display: block; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card { padding: 14px 16px; }
  .card .big { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .card .small { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .wide { grid-column: span 2; } .full { grid-column: 1 / -1; }
  #heat { display: grid; grid-template-columns: 34px repeat(24, 1fr); gap: 3px; font-size: 10px; color: var(--muted); }
  #heat div.c { aspect-ratio: 1; border-radius: 3px; }
  .share { display: grid; grid-template-columns: 190px 1fr 56px; gap: 10px; align-items: center; font-size: 13px; margin: 6px 0; }
  .share .track { height: 8px; background: rgba(255, 255, 255, 0.06); border-radius: 8px; overflow: hidden; }
  .share .fill { height: 100%; border-radius: 8px; }
  .share .fill.all { background: var(--spectrum); }
  footer { color: var(--muted); font-size: 11px; text-align: center; margin-top: 26px; }

  #tl { display: grid; grid-template-columns: 190px 1fr; gap: 22px; align-items: start; }
  #tlMonths { position: sticky; top: 0; max-height: calc(100vh - 190px); overflow: auto; padding: 10px; }
  .mo { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 5px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .mo:hover { background: rgba(255, 255, 255, 0.06); }
  .mo i { grid-column: 1 / 3; height: 2px; border-radius: 2px; background: var(--spectrum); opacity: 0.8; }
  .tlHead { font-size: 13px; font-weight: 600; margin: 18px 0 6px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 10px 1fr auto auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .row .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more { all: unset; cursor: pointer; margin: 16px 0; padding: 8px 16px; border-radius: 99px; border: 1px solid var(--line); font-size: 13px; }

  table.pv { border-collapse: separate; border-spacing: 3px; font-size: 12.5px; }
  table.pv th { font-weight: 500; color: var(--muted); text-align: right; padding: 4px 8px; white-space: nowrap; }
  table.pv thead th { text-align: center; }
  table.pv td { text-align: center; padding: 6px 10px; border-radius: 5px; min-width: 44px; font-variant-numeric: tabular-nums; }
  table.pv .tot { color: var(--muted); }
  .scroll { overflow: auto; padding-bottom: 8px; }

  .rv { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .rv .card p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.45; }
  .rv .line { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 13.5px; }
  .rv .line b { font-weight: 600; }
  .rv .go { cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .arrow { font-variant-numeric: tabular-nums; color: var(--muted); margin-left: auto; white-space: nowrap; }
  pre#ctx { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #c9c9d1; margin: 0 0 10px;
    max-height: 260px; overflow: auto; padding: 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.05); }
  .btn { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 99px; background: #f4f4f6; color: #000; font-size: 13px; font-weight: 600; }
  .btn:disabled { opacity: 0.45; cursor: wait; }
  .btn[hidden] { display: none; }
  #shareCard { width: min(920px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 20px;

  #shareCard::backdrop { background: rgba(0, 0, 0, 0.8); }
  .card-preview { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; align-items: start; }
  #yearCard { display: block; width: 100%; height: auto; border-radius: 10px; background: #000; }
  .card-actions { display: flex; flex-direction: column; gap: 16px; }
  .card-actions h2 { margin: 0; font-size: 22px; }
  .card-actions p { margin: 0; line-height: 1.5; }
  .card-actions label { display: flex; gap: 8px; align-items: center; font-size: 13px; }
  .card-actions input { accent-color: var(--accent); }
  #cardStatus { min-height: 36px; }
  #closeCard { align-self: start; background: transparent; color: var(--text); border: 1px solid var(--line); }
  @media (max-width: 600px) {
    .card-preview { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    #yearCard { max-height: 52vh; object-fit: contain; }
  }
  button:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible { outline: 2px solid #a77bff; outline-offset: 2px; }

  @media (max-width: 900px) {
    header { flex-wrap: wrap; padding: 10px 12px; gap: 8px; }
    nav { order: 3; width: 100%; overflow-x: auto; }
    .tools input { width: 120px; }
    #side { top: auto; bottom: 110px; left: 10px; right: 10px; width: auto; max-height: 34vh; display: none; }
    #side.on { display: block; }
    #sideToggle { display: block; position: fixed; left: 10px; bottom: 66px; z-index: 5; }
    #detail { top: auto; bottom: 110px; left: 10px; right: 10px; width: auto; max-height: 42vh; }
    #bar { bottom: 10px; gap: 6px; padding: 5px 8px; }
    #cut { width: 110px; } #cutLabel, #synWrap, #synSep { display: none; }
    #hint { display: none; }
    .page { inset: 128px 0 0 0; padding: 8px 14px 40px; }
    .grid { grid-template-columns: repeat(2, 1fr); } .rv { grid-template-columns: 1fr; }
    .wide, .full { grid-column: 1 / -1; }
    .share { grid-template-columns: 120px 1fr 44px; }
    #tl { grid-template-columns: 1fr; } #tlMonths { display: none; }
    .row { grid-template-columns: 10px 1fr auto; } .row .src { display: none; }
    .label3d { font-size: 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><h1 id="title" class="spectrum"></h1><p id="subtitle"></p></div>
  <nav id="tabs"></nav>
  <div class="tools">
    <input id="q" type="search" autocomplete="off">
    <select id="palette" aria-label="palette">
      <option value="spectrum">Spectrum</option><option value="aurora">Aurora</option><option value="lava">Lava</option>
      <option value="ocean">Ocean</option><option value="mono">Mono</option>
    </select>
  </div>
</header>

<section class="view on" id="view-brain">
  <div id="scene"></div>
  <aside id="side" class="panel">
    <h3 id="hTopics"></h3><div id="topics"></div>
    <h3 id="hSources" style="margin-top:14px"></h3><div id="sources" class="chips"></div>
  </aside>
  <button id="sideToggle" class="chip panel"></button>
  <div id="labels"></div>
  <div id="hint"></div>
  <div id="bar" class="panel">
    <div class="pill" id="layout"><button data-m="0" class="on"></button><button data-m="1"></button></div>
    <span class="sep"></span>
    <div class="pill" id="synWrap"><button id="syn"></button></div>
    <span class="sep" id="synSep"></span>
    <button id="play" aria-label="time-lapse">▶</button>
    <input id="cut" type="range" min="0" max="1000" value="1000">
    <span id="cutLabel"></span>
  </div>
  <aside id="detail" class="panel"></aside>
  <div id="tip"></div>
</section>

<section class="view" id="view-timeline"><div class="page"><div class="wrap">
  <h2 id="tlTitle"></h2><p class="sub" id="tlSub"></p>
  <div id="tl"><aside id="tlMonths" class="panel"></aside><div id="tlList"></div></div>
</div></div></section>

<section class="view" id="view-waves"><div class="page"><div class="wrap">
  <h2 id="wvTitle"></h2><p class="sub" id="wvSub"></p>
  <div class="ctl">
    <label><span id="wvSmoothL"></span><input id="wvSmooth" type="range" min="0" max="4" value="1"></label>
    <label><span id="wvScaleL"></span><select id="wvScale"></select></label>
  </div>
  <svg id="wavesSvg"></svg>
</div></div></section>

<section class="view" id="view-tables"><div class="page"><div class="wrap">
  <h2 id="tbTitle"></h2><p class="sub" id="tbSub"></p>
  <div class="ctl">
    <label><span id="tbRowsL"></span><select id="tbRows"></select></label>
    <label><span id="tbColsL"></span><select id="tbCols"></select></label>
    <label><span id="tbMeasL"></span><select id="tbMeas"></select></label>
  </div>
  <div class="scroll" id="tbOut"></div>
</div></div></section>

<section class="view" id="view-review"><div class="page"><div class="wrap">
  <h2 id="rvTitle"></h2><p class="sub" id="rvSub"></p>
  <div class="rv" id="rvCards"></div>
</div></div></section>

<section class="view" id="view-numbers"><div class="page"><div class="wrap">
  <h2 id="nbTitle"></h2><p class="sub" id="nbSub"></p>
  <div class="ctl"><button class="btn" id="shareCardOpen"></button></div>
  <div class="grid" id="cards"></div>
  <footer id="footer"></footer>
</div></div></section>

<dialog id="shareCard" aria-labelledby="shareCardTitle">
  <div class="card-preview">
    <canvas id="yearCard" width="1080" height="1350" role="img"></canvas>
    <div class="card-actions">
      <h2 id="shareCardTitle"></h2>
      <p class="muted" id="shareCardNote"></p>
      <label><input id="showTopicNames" type="checkbox"><span id="showTopicNamesLabel"></span></label>
      <button class="btn" id="downloadCard" disabled></button>
      <button class="btn" id="copyCard" disabled hidden></button>
      <p class="muted" id="cardStatus" role="status" aria-live="polite"></p>
      <button class="btn" id="closeCard"></button>
    </div>
  </div>
</dialog>

<script id="bp-data" type="application/json">__DATA__</script>
<script id="three-src" type="text/plain">__THREE__</script>

const U = { uScale: { value: 1 }, uTime: { value: 0 }, uMorph: { value: 0 }, uCut: { value: 1 } };
const vert = `
  attribute vec3 pos2; attribute float size; attribute float alpha; attribute vec3 color; attribute float tn; attribute float shape;
  uniform float uScale; uniform float uTime; uniform float uMode; uniform float uMorph; uniform float uCut;
  varying vec3 vColor; varying float vAlpha; varying float vShape;
  void main() {
    vec3 p = mix(position, pos2, uMorph);
    float a = alpha;
    if (uMode > 0.5 && uMode < 1.5) a *= 0.65 + 0.35 * sin(uTime * 1.3 + position.y * 5.0 + position.z * 3.0);
    if (uMode > 1.5) a *= 0.45 + 0.55 * pow(0.5 + 0.5 * sin(uTime * 2.2 - position.y * 7.0), 3.0);

      if (d > 0.5) discard;
      a = smoothstep(0.5, 0.0, d); a *= a; core = smoothstep(0.16, 0.0, d);
    } else if (vShape < 1.5) {               // note: diamond

    } else {                                 // message: ring

    blending: THREE.AdditiveBlending, uniforms: { ...U, uMode: { value: mode } } });

// decorative shell: brain outline that turns into galactic dust and orbit rings
const nShell = DATA.shell.length / 3, rnd = rnd32(42), dust = new Float32Array(nShell * 3);
const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(6.2832 * rnd());
for (let i = 0; i < nShell; i++) {
  let r, ang = rnd() * 6.2832, y;
  if (rnd() < 0.3) { r = [0.78, 1.22, 1.66, 2.08][i % 4] + (rnd() - 0.5) * 0.012; y = (rnd() - 0.5) * 0.012; }
  else { r = 0.3 + 1.9 * Math.sqrt(rnd()); y = gauss() * 0.045; if (rnd() < 0.6) ang = 6.2832 * Math.floor(rnd() * TP.length) / TP.length + 1.75 * r + gauss() * 0.3; }
  dust.set([r * Math.cos(ang), y, r * Math.sin(ang)], i * 3);
}
const shellCloud = cloud([['position', DATA.shell, 3], ['pos2', dust, 3], ['color', new Float32Array(nShell * 3).map((_, i) => [0.55, 0.65, 0.95][i % 3]), 3],
  ['size', new Float32Array(nShell).fill(5.5), 1], ['alpha', new Float32Array(nShell).fill(0.5), 1],
  ['tn', new Float32Array(nShell).fill(-1), 1], ['shape', new Float32Array(nShell), 1]], 1);

const baseSize = P.map(p => 15 * p[7]);
const ptCloud = cloud([['position', flat(P, 0, 3), 3], ['pos2', flat(P, 3, 6), 3], ['color', P.flatMap(p => rgb(p[6])), 3],
  ['size', baseSize.slice(), 1], ['alpha', new Float32Array(P.length).fill(0.95), 1], ['tn', P.map(p => p[8]), 1], ['shape', P.map(p => p[9]), 1]], 0);

const SP = DATA.spine;
const spCloud = cloud([['position', flat(SP, 0, 3), 3], ['pos2', flat(SP, 3, 6), 3], ['color', SP.flatMap(s => rgb(s[6])), 3],
  ['size', new Float32Array(SP.length).fill(5), 1], ['alpha', new Float32Array(SP.length).fill(0.75), 1],
  ['tn', SP.map(s => s[7]), 1], ['shape', new Float32Array(SP.length), 1]], 2);

// lines: all connections ("synapses") and the selected item's connections
const lineVert = `attribute vec3 pos2; attribute float tn; uniform float uMorph; varying float vT;
  void main() { vT = tn; gl_Position = projectionMatrix * modelViewMatrix * vec4(mix(position, pos2, uMorph), 1.0); }`;
const lineFrag = `uniform vec3 uColor; uniform float uOpacity; uniform float uCut; varying float vT;
  void main() { if (vT > uCut) discard; gl_FragColor = vec4(uColor, uOpacity); }`;
function lines(pairs, color, opacity) {
  const a = new Float32Array(pairs.length * 6), b = new Float32Array(pairs.length * 6), t = new Float32Array(pairs.length * 2);
  pairs.forEach(([i, j], n) => {
    a.set(P[i].slice(0, 3), n * 6); a.set(P[j].slice(0, 3), n * 6 + 3);
    b.set(P[i].slice(3, 6), n * 6); b.set(P[j].slice(3, 6), n * 6 + 3);
    t[n * 2] = t[n * 2 + 1] = Math.max(P[i][8], P[j][8]);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(a, 3)); g.setAttribute('pos2', new THREE.BufferAttribute(b, 3));
  g.setAttribute('tn', new THREE.BufferAttribute(t, 1));

    blending: THREE.AdditiveBlending, uniforms: { uMorph: U.uMorph, uCut: U.uCut, uColor: { value: new THREE.Color(color) }, uOpacity: { value: opacity } } });

    a.array[i] = vis[i] ? 0.95 : 0.05;

  a.needsUpdate = true;
  const sa = spCloud.geometry.attributes.alpha;

function recolor() {
  const c = ptCloud.geometry.attributes.color; P.forEach((p, i) => c.array.set(rgb(p[6]), i * 3)); c.needsUpdate = true;
  const sc = spCloud.geometry.attributes.color; SP.forEach((s, i) => sc.array.set(rgb(s[6]), i * 3)); sc.needsUpdate = true;

/* ------------------------------------------------------- camera, picking */
let yaw = -1.25, pitch = 0.18, dist = 5.0, pitchTo = 0.18, distTo = 5.0, gliding = false;
let autoRotate = true, dragging = false, moved = 0, lastX = 0, lastY = 0, pinch = 0, idle = 0;
const el = renderer.domElement, mouse = { x: -9, y: -9 }, v = new THREE.Vector3();
const zoom = f => { dist = Math.max(2.2, Math.min(14, dist * f)); gliding = false; };
el.addEventListener('pointerdown', e => { dragging = true; moved = 0; autoRotate = false; gliding = false; lastX = e.clientX; lastY = e.clientY; clearTimeout(idle); });
addEventListener('pointerup', () => { if (dragging) { dragging = false; idle = setTimeout(() => { if (S.sel < 0) autoRotate = true; }, 5000); } });
addEventListener('pointermove', e => {
  if (dragging) {
    yaw += (e.clientX - lastX) * 0.006;
    pitch = Math.max(-1.3, Math.min(1.3, pitch + (e.clientY - lastY) * 0.004));
    moved += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
  }
  mouse.x = e.clientX; mouse.y = e.clientY;
});
el.addEventListener('click', e => { if (moved < 6) select(pick(e.clientX, e.clientY)); });
el.addEventListener('wheel', e => { e.preventDefault(); zoom(1 + e.deltaY * 0.001); }, { passive: false });
el.addEventListener('touchmove', e => {
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinch) zoom(pinch / d);
    pinch = d;
  }
}, { passive: true });
el.addEventListener('touchend', () => { pinch = 0; });

function place(i, out) {
  const p = P[i], m = S.morph;
  return out.set(p[0] + (p[3] - p[0]) * m, p[1] + (p[4] - p[1]) * m, p[2] + (p[5] - p[2]) * m).add(root.position);
}
function screen(vec) { vec.project(camera); return { x: (vec.x * 0.5 + 0.5) * innerWidth, y: (-vec.y * 0.5 + 0.5) * innerHeight, z: vec.z }; }
function pick(mx, my) {
  let best = -1, bd = touch ? 26 : 13;
  for (let i = 0; i < P.length; i++) {
    if (!vis[i] || P[i][8] > S.cut) continue;
    const s = screen(place(i, v));
    if (s.z > 1) continue;
    const d = Math.hypot(s.x - mx, s.y - my);
    if (d < bd) { bd = d; best = i; }

}
const tip = $('tip');
let hovered = -1;

// Only aggregate fields enter the card. Never draw item titles, text or terms.
function yearCardStats() {
  let year = '';
  IT.forEach(it => { if (!it.u && it.d && it.d.slice(0, 4) > year) year = it.d.slice(0, 4); });
  const allTime = !year || IT.filter(it => !it.u && it.d.slice(0, 4) === year).length < 20;
  const months = new Map(), sources = new Map(), topics = new Map(), days = new Set(), hours = Array(24).fill(0);
  let items = 0, words = 0, chatWords = 0;
  IT.forEach((it, i) => {
    if (!allTime && (it.u || it.d.slice(0, 4) !== year)) return;
    items++; words += it.w;
    if (kindOf(i) === 'chat') chatWords += it.w;
    sources.set(it.s, (sources.get(it.s) || 0) + 1);
    topics.set(it.k, (topics.get(it.k) || 0) + 1);
    if (!it.u && it.d) {
      const month = it.d.slice(0, 7);
      months.set(month, (months.get(month) || 0) + 1);
      // UTC arithmetic on calendar dates avoids daylight-saving discontinuities.
      days.add(Date.parse(it.d + 'T00:00:00Z') / 86400000);
      if (Number.isInteger(it.h) && it.h >= 0 && it.h < 24) hours[it.h]++;
    }
  });
  let streak = 0, run = 0, prev = -Infinity;
  [...days].sort((a, b) => a - b).forEach(day => { run = day === prev + 1 ? run + 1 : 1; streak = Math.max(streak, run); prev = day; });
  // Ties use the earliest month/hour and source/topic identifier for stability.
  const ranked = map => [...map].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
  const first = IT.reduce((y, it) => (!it.u && it.d && (!y || it.d.slice(0, 4) < y) ? it.d.slice(0, 4) : y), '');
  return { year, first, allTime, items, words, chatWords, streak, month: ranked(months)[0],
    hour: hours.some(Boolean) ? hours.indexOf(Math.max(...hours)) : null,
    sources: ranked(sources).slice(0, 5), topics: ranked(topics).slice(0, 5) };
}

  ctx.font = '650 64px Inter';
  text(L.cardTitle, 72, 124, 64, gradient(ctx.measureText(L.cardTitle).width), 936, 650);
  // a year with little in it: the card covers all time, and says so
  const span = s.allTime && s.first && s.first !== s.year ? `${s.first}–${s.year}` : s.year;
  text(span || L.cardAllTime, 72, 244, span ? 112 : 72, '#f4f4f6', 936, 650);
  if (s.allTime && span) text(L.cardAllTime, 76, 290, 24, '#c5c5d0');
  const metric = (label, value, x, y, width, size = 64) => {
    text(value, x, y, size, '#f4f4f6', width, 600);
    text(label, x, y + 36, 21, '#b5b5c1', width);
  };
  metric(L.items, fmt(s.items), 72, 394, 420);
  metric(L.wordsYou, fmt(s.words), 552, 394, 456);
  metric(L.cardChatWords, fmt(s.chatWords), 72, 532, 936, 56);
  metric(L.busiestMonth, s.month ? monthName(s.month[0]) : '—', 72, 654, 300, 32);
  metric(L.streak, `${fmt(s.streak)} ${L.days}`, 396, 654, 288, 29);
  metric(L.cardHour, s.hour === null ? '—' : `${String(s.hour).padStart(2, '0')}:00`, 732, 654, 276, 32);
  text(L.cardSources, 72, 780, 22, '#b5b5c1', 390);
  text(L.cardTopTopics, 552, 780, 19, '#b5b5c1', 456);
  s.sources.forEach(([id, count], i) => {
    const y = 842 + i * 72;
    text(srcName(id), 72, y, 25, '#f4f4f6', 270);
    text(fmt(count), 456, y, 25, '#c5c5d0', 100, 500, 'right');
  });
  s.topics.forEach(([k, count], i) => {
    const y = 842 + i * 72;
    text($('showTopicNames').checked ? TP[k].name : L.cardTopic(i + 1), 552, y, 25, col(k), 340);
    text(`${Math.round(count / Math.max(1, s.items) * 100)}%`, 1008, y, 24, '#c5c5d0', 100, 500, 'right');
    ctx.fillStyle = col(k); ctx.fillRect(552, y + 16, 456 * count / Math.max(1, s.items), 3);
  });
  ctx.fillStyle = gradient(936); ctx.fillRect(72, 1220, 936, 2);
  text('brainplug.app', 72, 1284, 30, '#f4f4f6', 936, 600);
}

$('shareCardOpen').onclick = async () => {
  if (shareDialog.open) return;
  cardReady = false; cardButtons(false); $('cardStatus').textContent = '';
  shareCanvas.getContext('2d').clearRect(0, 0, 1080, 1350);
  shareDialog.showModal();
  try {
    await document.fonts.load('600 64px Inter');
    shareStats = yearCardStats();
    await new Promise(resolve => requestAnimationFrame(resolve));
    // Render and read in this same frame, even when a different tab is open.
    renderer.render(scene, camera);
    const ctx = shareBackground.getContext('2d'), source = renderer.domElement;
    const scale = Math.max(1080 / source.width, 1350 / source.height);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1080, 1350);
    ctx.drawImage(source, (1080 - source.width * scale) / 2, (1350 - source.height * scale) / 2, source.width * scale, source.height * scale);
    drawYearCard(); cardReady = true; cardButtons(true);
  } catch { $('cardStatus').textContent = L.cardError; }
};
$('closeCard').onclick = () => shareDialog.close();
$('showTopicNames').onchange = () => { if (cardReady) { drawYearCard(); $('cardStatus').textContent = ''; } };
const cardBlob = () => new Promise((resolve, reject) => shareCanvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('PNG encoding failed')), 'image/png'));
$('downloadCard').onclick = async () => {
  if (!cardReady) return;
  try {
    const url = URL.createObjectURL(await cardBlob()), link = document.createElement('a');
    link.href = url; link.download = `brainplug-${shareStats.year || 'all-time'}.png`;
    link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    $('cardStatus').textContent = '';
  } catch { $('cardStatus').textContent = L.cardError; }
};
$('copyCard').onclick = async () => {
  if (!cardReady) return;
  try {
    // Start the clipboard write in the click handler to retain user activation.
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': cardBlob() })]);
    $('cardStatus').textContent = L.copied;
  } catch { $('cardStatus').textContent = L.cardCopyError; }
};

/* -------------------------------------------------------------- numbers */
function drawNumbers() {
  $('nbTitle').textContent = L.nbTitle; $('nbSub').textContent = L.nbSub(N.first, N.last);
  const card = (label, big, small = '', cls = '') => `<div class="card panel ${cls}"><h3>${label}</h3><div class="big">${big}</div><div class="small">${small}</div></div>`;
  const kinds = KIND.map((k, i) => N.kinds[k] ? `${fmt(N.kinds[k])} ${L.kindsPl[i]}` : '').filter(Boolean).join(' · ');
  let h = card(L.items, fmt(N.items), kinds + (N.undated ? ` · ${L.undated(N.undated)}` : ''));
  h += card(L.writes, fmt(N.writes), `${fmt(N.active_days)} ${L.activeDays.toLowerCase()}`);
  h += card(L.wordsYou, fmt(N.words), `≈ ${fmt(Math.round(N.words / 250))} ${L.pages}`);
  h += card(L.streak, `${N.streak}`, L.days);
  h += card(L.busiestMonth, monthName(N.busiest_month.month), `${N.busiest_month.count} ${L.items.toLowerCase()}`);
  h += card(L.rhythm, `${String(N.busiest_hour).padStart(2, '0')}:00`, L.mostOn(L.weekdaysLong[N.busiest_weekday], N.busiest_hour));
  h += card(L.night, `${Math.round(N.night_share * 100)}%`, L.nightSub);
  h += card(L.longest, `${fmt(N.longest.words)} ${L.words}`, N.longest.title ? esc(N.longest.title) : `<i>${L.hidden}</i>`);
  const bar = (name, share, rel, color, extra = '') => `<div class="share"><span style="color:${color || 'inherit'}">${name}</span><div class="track"><div class="fill${color ? '' : ' all'}" style="width:${(rel * 100).toFixed(1)}%;${color ? 'background:' + color : ''}"></div></div><span style="text-align:right;color:#8b93a7">${share}${extra}</span></div>`;
  h += `<div class="card panel full"><h3>${L.bySource}</h3>${N.sources.map(s => bar(esc(srcName(s.id)), fmt(s.count), s.count / N.sources[0].count, '')).join('')}</div>`;
  const hmax = Math.max(1, ...N.heat.flat());
  let heat = '<div></div>' + Array.from({ length: 24 }, (_, x) => `<div style="text-align:center">${x % 3 === 0 ? x : ''}</div>`).join('');
  N.heat.forEach((row, d) => { heat += `<div>${L.weekdays[d]}</div>` + row.map(n => `<div class="c" title="${n}" style="background:rgba(167,123,255,${n ? (0.12 + 0.88 * Math.sqrt(n / hmax)).toFixed(2) : 0.04})"></div>`).join(''); });
  h += `<div class="card panel full"><h3>${L.heat}</h3><div id="heat">${heat}</div></div>`;
  h += `<div class="card panel full"><h3>${L.share}</h3>${TP.map(t => bar(esc(t.name), Math.round(t.share * 100), t.share / TP[0].share, col(t.id), '%')).join('')}</div>`;
  $('cards').innerHTML = h;
  $('footer').textContent = L.footer(DATA.meta.version);
}

/* ----------------------------------------------------------------- boot */
drawLegend();
setCut(1);
frame();
// small API used by the screenshot and test scripts
window.__bp = {
  ready: true, state: S, show, select, openItem, setLayout, setCut,
  pause: () => { autoRotate = false; clearTimeout(idle); }, yaw: y => { yaw = y; },
  morph: m => { setLayout(m >= 0.5 ? 1 : 0); S.morph = S.morphTo = m; pitch = pitchTo = 0.18 + 0.44 * m; dist = distTo = camDist(m); gliding = false; },
  project: i => { const s = screen(place(i, new THREE.Vector3())); return { x: s.x, y: s.y }; },
};
</script>
