name: tests
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the tests' time zone on Windows
        # tests set TZ=Europe/Madrid; Node honours it, but Python on Windows reads the system zone,
        # so phone times (WhatsApp) and ZIP file times would be read in different zones
        if: runner.os == 'Windows'
        run: tzutil /s "Romance Standard Time"
      - run: pip install -e ".[dev]"
      # Python package, plus the check that the browser engine (docs/app/engine) gives the same numbers
      - run: python -m pytest -q
      - run: python -m brainplug demo -o out/demo.html

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]" playwright
      - run: python -m playwright install --with-deps chromium
      - name: Set Chromium executable
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write(f"BRAINPLUG_CHROME={p.chromium.executable_path}\n")
          PY
      - name: Run browser tests without skips
        shell: bash
        run: |
          python -m pytest -q tests/browser -p no:cacheprovider -rs | tee "$RUNNER_TEMP/browser-tests.log"
          if grep -q '^SKIPPED ' "$RUNNER_TEMP/browser-tests.log"; then
            echo "Browser tests must run without skips."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: python -m ruff check .
