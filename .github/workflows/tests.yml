name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements.txt pytest mcp
      # Python package, plus the check that the browser engine (docs/app/engine) gives the same numbers
      - run: python -m pytest -q
      - run: python -m brainplug demo -o out/demo.html
